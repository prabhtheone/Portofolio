<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><style>body{font:16px system-ui;background:#0b1118;color:#e8f1ff;max-width:640px;margin:40px auto;padding:0 16px}input,textarea,button{display:block;width:100%;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #2a3a4a;background:#111b26;color:inherit}button{width:auto;display:inline-block;cursor:pointer;margin-right:6px}#msg{color:#39ff88}</style></head><body><h2>Portfolio admin</h2><div id="login"><input id="em" type="email" placeholder="email" autocomplete="username"><input id="pw" type="password" placeholder="password" autocomplete="current-password"><button id="in">Sign in</button></div><div id="app" hidden><button id="out">Sign out</button><h3>Projects</h3><div id="list"></div><h3>Add / edit</h3><input id="id" type="hidden"><input id="ti" placeholder="title"><textarea id="de" placeholder="description"></textarea><input id="ur" placeholder="https://github.com/..."><input id="tg" placeholder="tags"><input id="so" type="number" placeholder="order" value="0"><button id="sv">Save</button></div><p id="msg"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>const sb=supabase.createClient(CFG.url,CFG.key),$=i=>document.getElementById(i);async function sess(){const{data}=await sb.auth.getSession();$('login').hidden=!!data.session;$('app').hidden=!data.session;if(data.session)load()}$('in').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});$('msg').textContent=error?error.message:'';sess()};$('out').onclick=async()=>{await sb.auth.signOut();sess()};async function load(){const{data}=await sb.from('projects').select('*').order('sort');const l=$('list');l.textContent='';(data||[]).forEach(p=>{const r=document.createElement('div'),s=document.createElement('span'),e=document.createElement('button'),d=document.createElement('button');s.textContent=p.title+' ';e.textContent='edit';d.textContent='delete';e.onclick=()=>{$('id').value=p.id;$('ti').value=p.title;$('de').value=p.description||'';$('ur').value=p.url||'';$('tg').value=p.tags||'';$('so').value=p.sort};d.onclick=async()=>{if(confirm('Delete?')){await sb.from('projects').delete().eq('id',p.id);load()}};r.append(s,e,d);l.append(r)})}$('sv').onclick=async()=>{const row={title:$('ti').value,description:$('de').value,url:$('ur').value||null,tags:$('tg').value,sort:+$('so').value||0},id=$('id').value;const{error}=id?await sb.from('projects').update(row).eq('id',id):await sb.from('projects').insert(row);$('msg').textContent=error?error.message:'Saved';if(!error){$('id').value='';load()}};sess();</script></body></html>
